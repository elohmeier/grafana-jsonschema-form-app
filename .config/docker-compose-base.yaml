services:
  grafana:
    user: root
    container_name: 'elohmeier-jsonschema-form-app'

    build:
      context: .
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.4.0}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - ${GRAFANA_HOST:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000/tcp
    volumes:
      - ../dist:/var/lib/grafana/plugins/elohmeier-jsonschema-form-app
      - ../provisioning:/etc/grafana/provisioning
      - ..:/root/elohmeier-jsonschema-form-app

    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.elohmeier-jsonschema-form-app:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: elohmeier-jsonschema-form-app
